services:
  agentmemory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTMEMORY_VERSION: "0.9.30"
        III_VERSION: "0.22.1"
        III_SDK_VERSION: "0.22.1"
        VOYAGE_EMBEDDING_MODEL: "${VOYAGE_EMBEDDING_MODEL:-voyage-code-4}"
    restart: unless-stopped
    # Keeps an engine leak inside this container's cgroup instead of pushing the
    # whole host into swap and global OOM kills of unrelated services.
    mem_limit: "${AGENTMEMORY_MEM_LIMIT:-2g}"
    depends_on:
      valkey:
        condition: service_healthy
    # Coolify treats the compose file as the single source of truth: a variable
    # set in the dashboard only reaches the container if it is referenced here.
    environment:
      # Pinned rather than auto-detected. detectEmbeddingProvider() ranks
      # Gemini and OpenAI above Voyage, so adding an unrelated LLM key later
      # would silently switch the embedding backend and invalidate the index.
      EMBEDDING_PROVIDER: "voyage"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:?}"
      # Optional. When empty the entrypoint generates a secret on first boot
      # and prints it once — recoverable only if this container's stdout is
      # readable, which Coolify's single-container log API does not guarantee.
      # Setting it makes the credential reproducible and rotatable from here.
      AGENTMEMORY_SECRET: "${AGENTMEMORY_SECRET:-}"
      # A non-loopback viewer bind refuses to boot without both a secret and an
      # explicit Host allowlist (its DNS-rebinding defence). The secret comes
      # from the entrypoint's /data/.hmac; the allowlist must be supplied here.
      AGENTMEMORY_VIEWER_HOST: "0.0.0.0"
      VIEWER_ALLOWED_HOSTS: "${VIEWER_ALLOWED_HOSTS:?}"
      VIEWER_ALLOWED_ORIGINS: "${VIEWER_ALLOWED_ORIGINS:?}"
      # Summaries and consolidation run on an Anthropic-format endpoint (CLIProxy).
      # Without ANTHROPIC_MODEL the provider defaults to a Sonnet-class model.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-5-5}"
      # Per-observation compression is one LLM call per tool use; summaries and
      # consolidation cover recall at a fraction of the request volume.
      AGENTMEMORY_AUTO_COMPRESS: "${AGENTMEMORY_AUTO_COMPRESS:-false}"
      # The file backend holds every scope in the engine process: on this
      # store it measured 2.4 GB of engine RSS against 0.34 GB engine plus
      # 0.28 GB Valkey on the Redis backend, same data and index counts.
      AGENTMEMORY_STATE_BACKEND: "redis"
      AGENTMEMORY_REDIS_URL: "redis://valkey:6379"
    expose:
      - "3111"
      - "3113"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3111/agentmemory/livez || exit 1"]
      interval: 30s
      timeout: 5s
      # 0.9.30 runs one-time state migrations and an index backfill on first boot.
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # appendonly because the default snapshot policy can lose minutes of writes;
  # noeviction because an LRU policy would silently drop memories at the cap.
  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    command: valkey-server --appendonly yes --appendfsync everysec --maxmemory ${VALKEY_MAXMEMORY:-1gb} --maxmemory-policy noeviction
    mem_limit: "${VALKEY_MEM_LIMIT:-1536m}"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Routing bypasses Coolify's Traefik entirely: the tunnel dials out to
  # Cloudflare, so the host needs no inbound ports and no published port
  # exists for anyone to reach directly. Ingress hostnames are configured
  # remotely against the tunnel and resolve `agentmemory` over the network
  # Coolify creates for this stack.
  #
  # No `networks:` key here on purpose — Coolify attaches Traefik to its own
  # generated network, and a second custom network makes routing pick an
  # unreachable IP non-deterministically.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:?}"
    # Waiting on the healthcheck keeps the tunnel from advertising an origin
    # that would 502 while the engine is still rebuilding its index on boot.
    depends_on:
      agentmemory:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
  valkey-data:
