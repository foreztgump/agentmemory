services:
  agentmemory:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Caps the stack's engine and workers inside this container's cgroup so a
    # leak cannot push the host into swap. Node sizes the worker heap from this
    # limit (about half of it), and the in-memory vector index grows with the
    # store, so raise it as the store grows.
    mem_limit: "${AGENTMEMORY_MEM_LIMIT:-2560m}"
    depends_on:
      valkey:
        condition: service_healthy
    # Coolify treats the compose file as the single source of truth: a variable
    # set in the dashboard only reaches the container if it is referenced here.
    environment:
      AGENTMEMORY_DATA_DIR: /data
      HOME: /data/home
      III_COMPOSE_STATE_DIR: /data/compose-state
      III_TELEMETRY_ENABLED: "false"
      AGENTMEMORY_VIEWER_HOST: 0.0.0.0
      SERVICE_FQDN_AGENTMEMORY_3111: "${SERVICE_FQDN_AGENTMEMORY_3111:-}"
      # The viewer is served through the tunnel behind a Cloudflare Access
      # application, so its public Host and origin must be allowlisted here.
      VIEWER_ALLOWED_HOSTS: "${VIEWER_ALLOWED_HOSTS:?}"
      VIEWER_ALLOWED_ORIGINS: "${VIEWER_ALLOWED_ORIGINS:?}"
      # Pinned rather than auto-detected: detection ranks Gemini and OpenAI above
      # Voyage, so adding an unrelated key would switch the embedding backend.
      EMBEDDING_PROVIDER: "voyage"
      # Blank on purpose: provider detection prefers OpenAI and MiniMax keys over
      # Anthropic, so either one in the app's variables would move summaries
      # off the CLIProxy endpoint.
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FOR_LLM: "${OPENAI_API_KEY_FOR_LLM:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      OPENAI_EMBEDDING_API_KEY: "${OPENAI_EMBEDDING_API_KEY:-}"
      OPENAI_EMBEDDING_BASE_URL: "${OPENAI_EMBEDDING_BASE_URL:-}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-}"
      OPENAI_EMBEDDING_DIMENSIONS: "${OPENAI_EMBEDDING_DIMENSIONS:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-5-5}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:?}"
      VOYAGE_MODEL: "${VOYAGE_MODEL:-voyage-code-4}"
      COHERE_API_KEY: "${COHERE_API_KEY:-}"
      COHERE_MODEL: "${COHERE_MODEL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      MINIMAX_API_KEY: ""
      MINIMAX_MODEL: "${MINIMAX_MODEL:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      BM25_WEIGHT: "${BM25_WEIGHT:-}"
      VECTOR_WEIGHT: "${VECTOR_WEIGHT:-}"
      MAX_TOKENS: "${MAX_TOKENS:-}"
      TOKEN_BUDGET: "${TOKEN_BUDGET:-}"
      MAX_OBS_PER_SESSION: "${MAX_OBS_PER_SESSION:-}"
      CONSOLIDATION_ENABLED: "${CONSOLIDATION_ENABLED:-}"
      GRAPH_EXTRACTION_ENABLED: "${GRAPH_EXTRACTION_ENABLED:-}"
      AGENTMEMORY_AUTO_COMPRESS: "${AGENTMEMORY_AUTO_COMPRESS:-false}"
      AGENTMEMORY_INJECT_CONTEXT: "${AGENTMEMORY_INJECT_CONTEXT:-}"
      AGENTMEMORY_ALLOW_AGENT_SDK: "${AGENTMEMORY_ALLOW_AGENT_SDK:-}"
      AGENTMEMORY_SESSION_SWEEP_ENABLED: "${AGENTMEMORY_SESSION_SWEEP_ENABLED:-}"
      AGENTMEMORY_SESSION_SWEEP_STALE_HOURS: "${AGENTMEMORY_SESSION_SWEEP_STALE_HOURS:-}"
      AGENTMEMORY_FINALIZE_IDLE_MS: "${AGENTMEMORY_FINALIZE_IDLE_MS:-}"
      AGENTMEMORY_GRAPH_COMPACT_ON_BOOT: "${AGENTMEMORY_GRAPH_COMPACT_ON_BOOT:-}"
      AGENTMEMORY_DROP_STALE_INDEX: "${AGENTMEMORY_DROP_STALE_INDEX:-}"
      AGENTMEMORY_AUDIT_RETENTION_MONTHS: "${AGENTMEMORY_AUDIT_RETENTION_MONTHS:-}"
      AGENTMEMORY_AUDIT_MIGRATE_MAX_BYTES: "${AGENTMEMORY_AUDIT_MIGRATE_MAX_BYTES:-}"
      # The file backend holds every scope in the engine process; on this host it
      # measured 2.4 GB of engine RSS against 0.6 GB engine plus Valkey.
      AGENTMEMORY_STATE_BACKEND: "redis"
      AGENTMEMORY_REDIS_URL: "redis://valkey:6379"
      AGENTMEMORY_STATE_SAVE_INTERVAL_MS: "${AGENTMEMORY_STATE_SAVE_INTERVAL_MS:-}"
      AGENTMEMORY_SECRET: "${AGENTMEMORY_SECRET:-}"
      AGENT_ID: "${AGENT_ID:-}"
      TEAM_ID: "${TEAM_ID:-}"
      TEAM_MODE: "${TEAM_MODE:-}"
      USER_ID: "${USER_ID:-}"
      AGENTMEMORY_AGENT_SCOPE: "${AGENTMEMORY_AGENT_SCOPE:-}"
      SNAPSHOT_DIR: "${SNAPSHOT_DIR:-}"
      SNAPSHOT_ENABLED: "${SNAPSHOT_ENABLED:-}"
      SNAPSHOT_INTERVAL: "${SNAPSHOT_INTERVAL:-}"
      STANDALONE_PERSIST_PATH: "${STANDALONE_PERSIST_PATH:-}"
      CLAUDE_MEMORY_BRIDGE: "${CLAUDE_MEMORY_BRIDGE:-}"
      CLAUDE_MEMORY_LINE_BUDGET: "${CLAUDE_MEMORY_LINE_BUDGET:-}"
      CLAUDE_PROJECT_PATH: "${CLAUDE_PROJECT_PATH:-}"
      AGENTMEMORY_SUPPRESS_COST_WARNING: "${AGENTMEMORY_SUPPRESS_COST_WARNING:-}"
      AGENTMEMORY_TOOLS: "${AGENTMEMORY_TOOLS:-}"
      FALLBACK_PROVIDERS: "${FALLBACK_PROVIDERS:-}"
      OPENAI_API_VERSION: "${OPENAI_API_VERSION:-}"
      OPENAI_REASONING_EFFORT: "${OPENAI_REASONING_EFFORT:-}"
      OPENAI_TIMEOUT_MS: "${OPENAI_TIMEOUT_MS:-}"
      MINIMAX_BASE_URL: "${MINIMAX_BASE_URL:-}"
      OPENROUTER_EMBEDDING_MODEL: "${OPENROUTER_EMBEDDING_MODEL:-}"
      OPENROUTER_EMBEDDING_DIMENSIONS: "${OPENROUTER_EMBEDDING_DIMENSIONS:-}"
      AGENTMEMORY_LLM_TIMEOUT_MS: "${AGENTMEMORY_LLM_TIMEOUT_MS:-}"
      AGENTMEMORY_CAPTURE_MAX_ATTEMPTS: "${AGENTMEMORY_CAPTURE_MAX_ATTEMPTS:-}"
      AGENTMEMORY_CAPTURE_RETRY_INTERVAL_MS: "${AGENTMEMORY_CAPTURE_RETRY_INTERVAL_MS:-}"
      AGENTMEMORY_CAPTURE_DEDUP_HOURS: "${AGENTMEMORY_CAPTURE_DEDUP_HOURS:-}"
      AGENTMEMORY_CAPTURE_INBOX_MAX: "${AGENTMEMORY_CAPTURE_INBOX_MAX:-}"
      AGENTMEMORY_CAPTURE_DEAD_MAX: "${AGENTMEMORY_CAPTURE_DEAD_MAX:-}"
      AGENTMEMORY_CAPTURE_EVENTS_MAX: "${AGENTMEMORY_CAPTURE_EVENTS_MAX:-}"
      AGENTMEMORY_CAPTURE_SPOOL: "${AGENTMEMORY_CAPTURE_SPOOL:-}"
      AGENTMEMORY_CAPTURE_SPOOL_DIR: "${AGENTMEMORY_CAPTURE_SPOOL_DIR:-}"
      AGENTMEMORY_CAPTURE_SPOOL_MAX_BYTES: "${AGENTMEMORY_CAPTURE_SPOOL_MAX_BYTES:-}"
      AGENTMEMORY_CAPTURE_SPOOL_MAX_AGE_HOURS: "${AGENTMEMORY_CAPTURE_SPOOL_MAX_AGE_HOURS:-}"
      AGENTMEMORY_IMPORT_ROOT: "${AGENTMEMORY_IMPORT_ROOT:-}"
      AGENTMEMORY_EXPORT_ROOT: "${AGENTMEMORY_EXPORT_ROOT:-}"
      AGENTMEMORY_GRAPH_WEIGHT: "${AGENTMEMORY_GRAPH_WEIGHT:-}"
      SUMMARIZE_CHUNK_SIZE: "${SUMMARIZE_CHUNK_SIZE:-}"
      SUMMARIZE_CHUNK_CONCURRENCY: "${SUMMARIZE_CHUNK_CONCURRENCY:-}"
      CONSOLIDATION_DECAY_DAYS: "${CONSOLIDATION_DECAY_DAYS:-}"
      CONSOLIDATION_INTERVAL_MS: "${CONSOLIDATION_INTERVAL_MS:-}"
      AGENTMEMORY_CONSOLIDATION_COOLDOWN_MS: "${AGENTMEMORY_CONSOLIDATION_COOLDOWN_MS:-}"
      AGENTMEMORY_FOLLOWUP_WINDOW_SECONDS: "${AGENTMEMORY_FOLLOWUP_WINDOW_SECONDS:-}"
      GRAPH_EXTRACTION_BATCH_SIZE: "${GRAPH_EXTRACTION_BATCH_SIZE:-}"
      AGENTMEMORY_LLM_NOTHINK: "${AGENTMEMORY_LLM_NOTHINK:-}"
      AGENTMEMORY_REFLECT: "${AGENTMEMORY_REFLECT:-}"
      AGENTMEMORY_IMAGE_EMBEDDINGS: "${AGENTMEMORY_IMAGE_EMBEDDINGS:-}"
      AGENTMEMORY_IMAGE_STORE_MAX_BYTES: "${AGENTMEMORY_IMAGE_STORE_MAX_BYTES:-}"
      AGENTMEMORY_AUDIT_INDEX_PERSIST: "${AGENTMEMORY_AUDIT_INDEX_PERSIST:-}"
      AGENTMEMORY_INDEX_SAVE_INTERVAL_MS: "${AGENTMEMORY_INDEX_SAVE_INTERVAL_MS:-}"
      AGENTMEMORY_VECTOR_BUCKET_SIZE: "${AGENTMEMORY_VECTOR_BUCKET_SIZE:-}"
      AGENTMEMORY_VECTOR_BACKFILL_MAX: "${AGENTMEMORY_VECTOR_BACKFILL_MAX:-}"
      AGENTMEMORY_VECTOR_BACKFILL: "${AGENTMEMORY_VECTOR_BACKFILL:-}"
      AGENTMEMORY_SLOTS: "${AGENTMEMORY_SLOTS:-}"
      AGENTMEMORY_PROVIDER: "${AGENTMEMORY_PROVIDER:-}"
      AGENTMEMORY_VERBOSE: "${AGENTMEMORY_VERBOSE:-}"
      OBSIDIAN_AUTO_EXPORT: "${OBSIDIAN_AUTO_EXPORT:-}"
      AUTO_FORGET_ENABLED: "${AUTO_FORGET_ENABLED:-}"
      AUTO_FORGET_INTERVAL_MS: "${AUTO_FORGET_INTERVAL_MS:-}"
      LESSON_DECAY_ENABLED: "${LESSON_DECAY_ENABLED:-}"
      INSIGHT_DECAY_ENABLED: "${INSIGHT_DECAY_ENABLED:-}"
      REBUILD_EMBED_BATCH_SIZE: "${REBUILD_EMBED_BATCH_SIZE:-}"
      RERANK_ENABLED: "${RERANK_ENABLED:-}"
    expose:
      - "3111"
      - "3113"
    volumes:
      - agentmemory-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3111/agentmemory/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      # First boot after an upgrade migrates the vector index and rebuilds BM25.
      start_period: 300s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # appendonly because the default snapshot policy can lose minutes of writes;
  # noeviction because an LRU policy would silently drop memories at the cap.
  valkey:
    image: valkey/valkey:9
    restart: unless-stopped
    command: valkey-server --appendonly yes --appendfsync everysec --maxmemory ${VALKEY_MAXMEMORY:-1gb} --maxmemory-policy noeviction
    mem_limit: "${VALKEY_MEM_LIMIT:-1536m}"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Routing bypasses Coolify's Traefik entirely: the tunnel dials out to
  # Cloudflare, so the host needs no inbound ports. Ingress hostnames are
  # configured remotely against the tunnel and resolve `agentmemory` over the
  # network Coolify creates for this stack. No `networks:` key on purpose: a
  # second custom network makes routing pick an unreachable IP.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN:?}"
    # Waiting on the health check keeps the tunnel from advertising an origin
    # that would 502 while the worker is still loading its index on boot.
    depends_on:
      agentmemory:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentmemory-data:
  valkey-data:
